<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SpineMotion — 在浏览器本地运行的人体运动捕捉、复刻与分析实验室。"
    />
    <meta name="theme-color" content="#070b14" />
    <!--
      Offline-first security boundary: the app only talks to its own origin.
      This also blocks MediaPipe's bundled usage-telemetry endpoint. Camera
      frames are processed in-memory and never uploaded.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob: mediastream:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>SpineMotion — Human Motion Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
